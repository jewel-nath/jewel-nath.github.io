<!doctype html>
<!--
  The 1200 x 630 picture that LinkedIn, X and chat apps show for a link to the site.
  Render it after `npm install`, from the repository root:
  chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png scripts/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2-variations');
      }

      :root {
        --paper: #f2f4f5;
        --ink: #18212b;
        --ink-soft: #4b5663;
        --rule: #cfd5db;
        --signal: #f25c05;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Archivo Variable', sans-serif;
      }

      .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 520px;
        align-items: center;
        gap: 48px;
        height: 100%;
        padding: 0 56px 0 72px;
        box-sizing: border-box;
        border-top: 10px solid var(--ink);
      }

      h1 {
        margin: 0;
        font-size: 124px;
        font-weight: 800;
        font-stretch: 125%;
        line-height: 0.9;
        letter-spacing: -0.03em;
      }

      .tagline {
        margin: 30px 0 0;
        font-size: 25px;
        font-weight: 600;
        font-stretch: 110%;
      }

      .tagline i {
        font-style: normal;
        white-space: nowrap;
      }

      .tagline span {
        margin-inline: 0.1em;
        color: var(--ink-soft);
        font-weight: 400;
      }

      .domain {
        margin: 44px 0 0;
        font-size: 26px;
        font-weight: 700;
        font-stretch: 112%;
      }

      .domain::before {
        content: '';
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 14px;
        border-radius: 50%;
        background: var(--signal);
      }

      canvas {
        width: 520px;
        height: 520px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1>Jewel<br />Nath</h1>
        <p class="tagline"><i>Software Engineer</i> <span>/</span> <i>AI Agents &amp; Automation</i> <span>/</span> <i>Robotics</i></p>
        <p class="domain">jewelnath.dev</p>
      </div>
      <canvas width="1040" height="1040"></canvas>
    </div>
    <script>
      // A still copy of the scan in src/components/LidarScan.astro, at the end of its turn.
      const TAU = Math.PI * 2;
      const box = (x0, y0, x1, y1) => [
        [x0, y0, x1, y0],
        [x1, y0, x1, y1],
        [x1, y1, x0, y1],
        [x0, y1, x0, y0],
      ];
      const segments = [
        [-2.6, -1.8, 0.6, -1.8],
        [1.5, -1.8, 3.4, -1.8],
        [3.4, -1.8, 3.4, 1.2],
        [3.4, 1.2, 1.6, 1.2],
        [1.6, 1.2, 1.6, 2.6],
        [1.6, 2.6, -2.6, 2.6],
        [-2.6, 2.6, -2.6, -1.8],
        [-0.4, -3.0, 2.6, -3.0],
        ...box(-2.5, 1.65, -0.9, 2.5),
        ...box(-2.5, -1.7, -1.95, -0.95),
        ...box(0.85, 1.75, 1.3, 2.2),
      ];
      const legs = [
        [1.9, -1.0, 0.035],
        [2.8, -1.0, 0.035],
        [1.9, -0.25, 0.035],
        [2.8, -0.25, 0.035],
      ];
      const view = { minX: -3.0, maxX: 3.8, minY: -3.4, maxY: 3.0 };

      let seed = 7;
      const next = () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const gaussian = () => Math.sqrt(-2 * Math.log(1 - next())) * Math.cos(TAU * next());

      const cast = (dx, dy) => {
        let nearest = Infinity;
        for (const [ax, ay, bx, by] of segments) {
          const ex = bx - ax;
          const ey = by - ay;
          const d = dx * ey - dy * ex;
          if (Math.abs(d) < 1e-9) continue;
          const t = (ax * ey - ay * ex) / d;
          const u = (ax * dy - ay * dx) / d;
          if (t > 0.05 && u >= 0 && u <= 1 && t < nearest) nearest = t;
        }
        for (const [cx, cy, r] of legs) {
          const b = -(dx * cx + dy * cy);
          const disc = b * b - (cx * cx + cy * cy - r * r);
          if (disc < 0) continue;
          const t = -b - Math.sqrt(disc);
          if (t > 0.05 && t < nearest) nearest = t;
        }
        return nearest;
      };

      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const style = getComputedStyle(document.documentElement);
      const color = (name) => style.getPropertyValue(name).trim();
      const scale = Math.min(canvas.width / (view.maxX - view.minX), canvas.height / (view.maxY - view.minY));
      const ox = (canvas.width - (view.maxX - view.minX) * scale) / 2 - view.minX * scale;
      const oy = (canvas.height - (view.maxY - view.minY) * scale) / 2 + view.maxY * scale;

      ctx.strokeStyle = color('--rule');
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let x = Math.ceil(view.minX); x <= view.maxX; x++) {
        ctx.moveTo(ox + x * scale, 0);
        ctx.lineTo(ox + x * scale, canvas.height);
      }
      for (let y = Math.ceil(view.minY); y <= view.maxY; y++) {
        ctx.moveTo(0, oy - y * scale);
        ctx.lineTo(canvas.width, oy - y * scale);
      }
      ctx.stroke();

      ctx.fillStyle = color('--signal');
      for (let i = 0; i < 720; i++) {
        const angle = (i / 720) * TAU;
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        const range = cast(dx, dy);
        if (range > 8 || next() < 0.04) continue;
        const measured = range + gaussian() * (0.008 + range * 0.004);
        ctx.fillRect(ox + dx * measured * scale - 2.5, oy - dy * measured * scale - 2.5, 5, 5);
      }

      ctx.save();
      ctx.translate(ox, oy);
      ctx.fillStyle = color('--ink');
      for (const [wx, wy] of [
        [0.16, 0.2],
        [-0.16, 0.2],
        [0.16, -0.2],
        [-0.16, -0.2],
      ]) {
        ctx.fillRect((wx - 0.055) * scale, (-wy - 0.028) * scale, 0.11 * scale, 0.056 * scale);
      }
      ctx.fillRect(-0.22 * scale, -0.17 * scale, 0.44 * scale, 0.34 * scale);
      ctx.fillStyle = color('--paper');
      ctx.beginPath();
      ctx.arc(0.06 * scale, 0, 0.065 * scale, 0, TAU);
      ctx.fill();
      ctx.restore();
    </script>
  </body>
</html>
