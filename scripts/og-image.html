<!doctype html>
<!--
  The 1200 x 630 picture that LinkedIn, X and chat apps show for a link to the site.
  Render it after `npm install`, from the repository root:
  chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png scripts/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Newsreader Variable';
        font-weight: 200 800;
        src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2') format('woff2-variations');
      }

      @font-face {
        font-family: 'Inter Variable';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
      }

      @font-face {
        font-family: 'Geist Variable';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2-variations');
      }

      /* The site's dark theme. */
      :root {
        --bg: #0f1114;
        --card: #171a1f;
        --border: #272c33;
        --text: #c6cbd2;
        --heading: #f3efe6;
        --muted: #8c929b;
        --accent: #e3b341;
        --accent-hi: #f2c95f;
        --accent-soft: rgba(227, 179, 65, 0.12);
        --on-accent: #1b1404;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        color: var(--text);
        font: 400 22px/1.5 'Inter Variable', sans-serif;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(760px 420px at 0% 0%, rgba(227, 179, 65, 0.16), transparent 70%),
          radial-gradient(620px 460px at 100% 100%, rgba(227, 179, 65, 0.07), transparent 70%),
          var(--bg);
      }

      .page {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 392px;
        gap: 48px;
        padding: 60px 64px 56px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 600 22px 'Geist Variable', sans-serif;
        letter-spacing: -0.02em;
        color: var(--heading);
        margin-bottom: 40px;
      }

      .brand span {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-size: 15px;
        font-weight: 700;
        color: var(--on-accent);
        background: linear-gradient(135deg, var(--accent-hi), var(--accent));
        box-shadow: 0 6px 22px rgba(227, 179, 65, 0.3);
      }

      .who {
        display: flex;
        align-items: center;
        gap: 28px;
        margin-bottom: 24px;
      }

      .portrait {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        padding: 4px;
        flex: none;
        background: conic-gradient(from 210deg, var(--accent), rgba(227, 179, 65, 0.42), var(--accent));
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      }

      .portrait img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--bg);
        display: block;
      }

      h1 {
        margin: 0;
        font: 500 82px/1 'Newsreader Variable', serif;
        font-variation-settings: 'opsz' 72;
        letter-spacing: -0.02em;
        color: var(--heading);
      }

      .role {
        margin: 0 0 14px;
        font-size: 24px;
        font-weight: 500;
        color: var(--heading);
      }

      .role i {
        font-style: normal;
        color: var(--accent);
        padding: 0 8px;
      }

      .lede {
        margin: 0 0 30px;
        font-size: 25px;
        line-height: 1.45;
        max-width: 30em;
      }

      .lede b {
        color: var(--heading);
        font-weight: 600;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chips span {
        font-size: 17px;
        font-weight: 500;
        padding: 6px 15px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--heading);
      }

      /* The work, as a stack of two photo cards. */
      .work {
        position: relative;
        align-self: center;
        height: 512px;
      }

      .card {
        position: absolute;
        width: 300px;
        border-radius: 18px;
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }

      .card img {
        display: block;
        width: 100%;
        height: 196px;
        object-fit: cover;
      }

      .card p {
        margin: 0;
        padding: 12px 16px 14px;
        font-size: 17px;
        color: var(--heading);
        font-weight: 600;
      }

      .card p span {
        display: inline-block;
        margin-left: 8px;
        font-size: 13px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        vertical-align: 2px;
      }

      .card.one {
        top: 0;
        right: 0;
        transform: rotate(2deg);
      }

      .card.two {
        bottom: 0;
        left: 0;
        transform: rotate(-3deg);
      }

      .card.two img {
        object-position: 50% 30%;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div>
        <div class="brand"><span>JN</span>jewelnath.dev</div>
        <div class="who">
          <div class="portrait"><img src="../src/assets/home/portrait.jpg" alt="" /></div>
          <h1>Jewel Nath</h1>
        </div>
        <p class="role">Software Engineer<i>·</i>AI Agents &amp; Automation<i>·</i>Robotics</p>
        <p class="lede">I build <b>AI agents and automation</b> for real products, and put them on <b>robots I build myself</b>.</p>
        <div class="chips">
          <span>AI agents &amp; MCP</span>
          <span>ROS 2 robots</span>
          <span>2 technical reports with DOIs</span>
        </div>
      </div>
      <div class="work">
        <div class="card one">
          <img src="../src/assets/orbibot/v1/v1-2025-09-24-pi5-build-front.jpg" alt="" />
          <p>OrbiBot V1<span>Built and driven</span></p>
        </div>
        <div class="card two">
          <img src="../src/assets/home/robot-niko-2022-11-29-full-robot.jpg" alt="" />
          <p>Robot Niko<span>Built</span></p>
        </div>
      </div>
    </div>
  </body>
</html>
